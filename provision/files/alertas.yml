# =============================================================================
#  Regras de alerta do homelab. Cada alerta aponta para o runbook que resolve.
# =============================================================================
groups:
  - name: disponibilidade
    rules:
      - alert: MaquinaFora
        expr: up{job="node"} == 0
        for: 1m
        labels: { severidade: critica }
        annotations:
          resumo: "{{ $labels.instance }} não responde há 1 minuto"
          runbook: "docs/troubleshooting/TS-05-alerta-disparou.md#maquinafora"

      - alert: SemPing
        expr: probe_success{job="ping"} == 0
        for: 1m
        labels: { severidade: critica }
        annotations:
          resumo: "{{ $labels.instance }} não responde ping"
          runbook: "docs/troubleshooting/TS-05-alerta-disparou.md#semping"

      - alert: PortaDeServicoFechada
        expr: probe_success{job="servicos-tcp"} == 0
        for: 1m
        labels: { severidade: critica }
        annotations:
          resumo: "Serviço {{ $labels.servico }} ({{ $labels.instance }}) não aceita conexão"
          runbook: "docs/troubleshooting/TS-05-alerta-disparou.md#portadeservicofechada"

      - alert: DnsDoDominioFalhando
        expr: probe_success{job="dns"} == 0
        for: 1m
        labels: { severidade: critica }
        annotations:
          resumo: "O DNS do domínio não está respondendo os registros do AD"
          runbook: "docs/troubleshooting/TS-02-nome-nao-resolve.md"

      - alert: ServicoParado
        expr: node_systemd_unit_state{state="active"} == 0
        for: 30s
        labels: { severidade: critica }
        annotations:
          resumo: "Serviço {{ $labels.name }} parado em {{ $labels.instance }}"
          runbook: "docs/troubleshooting/TS-05-alerta-disparou.md#servicoparado"

  - name: capacidade
    rules:
      - alert: DiscoQuaseCheio
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 5m
        labels: { severidade: aviso }
        annotations:
          resumo: "Menos de 15% livre em {{ $labels.mountpoint }} ({{ $labels.instance }})"
          runbook: "docs/troubleshooting/TS-05-alerta-disparou.md#discoquasecheio"

      - alert: MemoriaAlta
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels: { severidade: aviso }
        annotations:
          resumo: "Uso de memória acima de 90% em {{ $labels.instance }}"
          runbook: "docs/troubleshooting/TS-05-alerta-disparou.md#memoriaalta"
